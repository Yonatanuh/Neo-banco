server.port=5000

# MongoDB Atlas Configuration (Usando Variables de Entorno)
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=neobanco
spring.data.mongodb.auto-index-creation=false

# Optimizacion de Red: Compresion GZIP para agilizar las 16 peticiones del Dashboard
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

# JWT Configuration (Usando Variables de Entorno)
jwt.secret=${JWT_SECRET}
jwt.expiration=2592000000

# CORS
cors.allowed-origins=http://localhost:5173
